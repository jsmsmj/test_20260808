<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Move Sample</title>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #5ea830;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none; /* iOSで長押し時にテキスト/画像選択の虫眼鏡・コピーメニューが出るのを防ぐ */
    -webkit-tap-highlight-color: transparent; /* タップ時の水色ハイライトを消す */
  }
  canvas, #player {
    -webkit-user-drag: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh; /* dvh未対応ブラウザ向けフォールバック */
    height: 100dvh; /* iOS Safariのアドレスバー等で実際に見えている高さに追従させる(100vhは非表示時基準で大きくなり、bottom:0のジョイスティックが画面外に出てしまうため) */
    overflow: hidden;
  }
  #game {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center center;
  }
  #world {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #player {
    position: absolute;
    width: 36px;
    height: 36px;
    margin-left: -18px;
    margin-top: -18px;
    border-radius: 50%;
    background: #ffca28;
    border: 3px solid #6d4c00;
    box-sizing: border-box;
    transition: transform 0.15s ease;
    z-index: 5;
  }
  #player.hit {
    background: #ff5252;
    transform: scale(1.3);
  }
  #player.licked {
    animation: lick-wiggle 0.18s infinite;
  }
  @keyframes lick-wiggle {
    0%, 100% { transform: scale(1.15) translate(0, 0) rotate(0deg); }
    20% { transform: scale(1.15) translate(-3px, 2px) rotate(-8deg); }
    40% { transform: scale(1.15) translate(3px, -2px) rotate(7deg); }
    60% { transform: scale(1.15) translate(-3px, -2px) rotate(-6deg); }
    80% { transform: scale(1.15) translate(3px, 2px) rotate(8deg); }
  }
  #fx-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  /* スマホでジョイスティックを認識する範囲(左下エリア)。操作可能な範囲だと分かる程度に薄く表示
     #game(scaleで縮小される)ではなく#viewport直下に置き、実画面のピクセルサイズで
     操作範囲・ジョイスティック自体の見た目サイズが確保されるようにしている */
  #joystick-zone {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 50%;
    height: 50%;
    background: rgba(255, 255, 255, 0.05);
    z-index: 50;
  }
  /* 常時表示しておく操作ヒント用のジョイスティック絵(見た目だけ、タッチは通過させる)。
     実際のジョイスティックはnipplejsのdynamicモードのまま(触れた場所が中心になる)なので、
     操作を始めた瞬間(nipplejsの'start')にこちらは隠し、離したら('end')また表示し直す */
  #joystick-hint {
    position: absolute;
    left: 15%;
    bottom: 15%;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.4);
    pointer-events: none;
  }
  #joystick-hint::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 42px;
    height: 42px;
    margin: -21px 0 0 -21px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
  }
  #joystick-hint.hide {
    display: none;
  }
  #hint {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    font-family: sans-serif;
    font-size: 13px;
    max-width: calc(100% - 130px);
    line-height: 1.4;
    z-index: 6;
  }
  #dog-debug {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #ffeb3b;
    background: rgba(0, 0, 0, 0.45);
    padding: 3px 8px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 13px;
    z-index: 6;
  }
  #hud {
    position: absolute;
    top: 10px;
    right: 14px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    font-family: sans-serif;
    font-size: 36px;
    font-weight: bold;
    text-align: right;
    z-index: 6;
  }
  #hud .best {
    font-size: 26px;
    font-weight: normal;
    opacity: 0.85;
  }
  #miss-overlay {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff5252;
    font-family: sans-serif;
    font-size: 42px;
    font-weight: bold;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s ease;
    z-index: 7;
  }
  #miss-overlay.show {
    opacity: 1;
  }
  #miss-overlay .tap-hint {
    display: block;
    margin-top: 8px;
    color: #fff;
    font-size: 16px;
    font-weight: normal;
  }
  #miss-overlay .miss-coin-score {
    display: block;
    margin-top: 10px;
    color: #ffd54f;
    font-size: 22px;
    font-weight: bold;
  }
  #life-hud {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 6;
  }
  #life-bar-track {
    width: 180px;
    height: 32px;
    background: rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 8px;
    overflow: hidden;
    box-sizing: border-box;
  }
  #life-bar-fill {
    height: 100%;
    width: 100%;
    background: #4caf50;
    transition: width 0.2s ease, background-color 0.2s ease;
  }
  #lives-text {
    color: #fff;
    font-family: sans-serif;
    font-size: 15px;
    font-weight: bold;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    white-space: nowrap;
  }
  @keyframes blink-invincible {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.25; }
  }
  #player.invincible {
    animation: blink-invincible 0.2s steps(1, end) infinite;
  }
  #gameover-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 8;
  }
  #gameover-overlay.show {
    opacity: 1;
  }
  #gameover-overlay .go-title {
    font-size: 40px;
    font-weight: bold;
    color: #ff5252;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  }
  #gameover-overlay .go-stats {
    display: block;
    margin-top: 8px;
    font-size: 20px;
    font-weight: bold;
  }
  #gameover-overlay .tap-hint {
    display: block;
    margin-top: 22px;
    font-size: 16px;
    opacity: 0.85;
  }
  #daynight-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ff8a3d;
    opacity: 0;
    pointer-events: none;
    z-index: 9;
  }
  /* 初回起動時の遊び方説明。#game(scaleで縮小される)の外側、#viewport基準で全画面に出すことで
     #gameが小さい端末でも文字が縮小されず読みやすいままにしている */
  #intro-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
    z-index: 90;
    transition: opacity 0.2s ease;
  }
  #intro-overlay.hide {
    display: none;
  }
  #intro-overlay .intro-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  #intro-overlay .intro-goal {
    font-size: 14px;
    font-weight: bold;
    color: #ffd54f;
    margin-bottom: 16px;
  }
  #intro-overlay .intro-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(320px, 86vw);
    margin: 6px 0;
    text-align: left;
  }
  #intro-overlay .intro-icon {
    width: 34px;
    height: 34px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    object-fit: contain; /* imgタグ(風船)がアスペクト比を保ったまま34x34に収まるように */
  }
  #intro-overlay .intro-icon.intro-player-dot {
    /* 実際の#playerと同じ配色・比率のミニチュア(自機の紹介用) */
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ffca28;
    border: 3px solid #6d4c00;
    box-sizing: border-box;
  }
  #intro-overlay .intro-text {
    font-size: 12.5px;
    line-height: 1.4;
  }
  #intro-overlay .tap-hint {
    margin-top: 18px;
    font-size: 14px;
    opacity: 0.9;
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="game">
    <canvas id="world"></canvas>
    <div id="player"></div>
    <canvas id="fx-layer"></canvas>
<!--
    <div id="hint">WASD / 画面左下ドラッグで移動・奥(上)へ進もう。犬にぶつかるとミス!</div>
-->
<!--
    <div id="dog-debug">画面内の犬: <span id="dogDebugActual">0</span> / 目標<span id="dogDebugTarget">0</span></div>
-->
    <div id="life-hud">
      <div id="life-bar-track"><div id="life-bar-fill"></div></div>
<!--
      <div id="lives-text">残機×<span id="livesCount">3</span></div>
-->
    </div>
    <div id="hud">距離: <span id="score">0</span>m<br><span class="best">ベスト: <span id="best">0</span>m</span><br>コイン: <span id="coinScore">0</span>枚</div>
    <div id="miss-overlay">ミス!<span class="miss-coin-score">コイン: <span id="missCoinScore">0</span>枚</span><span class="tap-hint">移動 or 約3秒で復帰</span></div>
    <div id="gameover-overlay">
      <span class="go-title">ゲームオーバー</span>
      <span class="go-stats">ベスト距離: <span id="goDistance">0</span>m</span>
      <span class="go-stats">コイン: <span id="goCoins">0</span>枚</span>
      <span class="tap-hint">タップして最初から</span>
    </div>
    <div id="daynight-overlay"></div>
  </div>
  <div id="joystick-zone">
    <div id="joystick-hint"></div>
  </div>
  <div id="intro-overlay">
    <span class="intro-title">あそびかた</span>
    <span class="intro-goal">奥(画面上)へ進んでコインを集めよう!</span>
    <div class="intro-row">
      <span class="intro-icon intro-player-dot"></span>
      <span class="intro-text">これがあなたの自機</span>
    </div>
    <div class="intro-row">
      <span class="intro-icon">🕹️</span>
      <span class="intro-text">仮想ジョイパッド or WASDキーで自機を操作</span>
    </div>
    <div class="intro-row">
      <canvas id="intro-icon-dog" class="intro-icon"></canvas>
      <span class="intro-text">犬にぶつかると愛情表現でライフが減る。ライフが0になるとゲームオーバー</span>
    </div>
    <div class="intro-row">
      <canvas id="intro-icon-coin" class="intro-icon"></canvas>
      <span class="intro-text">コインを集めよう</span>
    </div>
    <div class="intro-row">
      <img src="imgs/balloon-red.png" class="intro-icon" alt="balloon">
      <span class="intro-text">風船はお助けアイテム</span>
    </div>
    <span class="tap-hint">タップ or WASDでスタート</span>
  </div>
</div>

<script>
  const viewportEl = document.getElementById('viewport');
  const gameEl = document.getElementById('game');
  const playerEl = document.getElementById('player');
  const zone = document.getElementById('joystick-zone');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const coinScoreEl = document.getElementById('coinScore');
  const missCoinScoreEl = document.getElementById('missCoinScore');
  const missEl = document.getElementById('miss-overlay');
  const lifeBarFillEl = document.getElementById('life-bar-fill');
  // const livesCountEl = document.getElementById('livesCount');
  const gameOverEl = document.getElementById('gameover-overlay');
  const goDistanceEl = document.getElementById('goDistance');
  const goCoinsEl = document.getElementById('goCoins');
  const dogDebugActualEl = document.getElementById('dogDebugActual');
  const dogDebugTargetEl = document.getElementById('dogDebugTarget');
  const daynightOverlayEl = document.getElementById('daynight-overlay');
  const introOverlayEl = document.getElementById('intro-overlay');
  const introDogIconEl = document.getElementById('intro-icon-dog');
  const introCoinIconEl = document.getElementById('intro-icon-coin');

  // --- 論理解像度を初回起動時のウィンドウサイズに固定し、以降のリサイズは拡大縮小のみで対応する ---
  const BASE_W = 800;
  // 犬・コイン・レーンは常にこの縦深さ分だけ生成・管理しておく(=縦持ち時にちょうど収まる1.5倍の深さ)。
  // 横向きでは実際に見えるのは手前のviewH(600)分だけだが、奥側300分も既に生成済みにしておくことで、
  // プレイ中に縦持ちへ切り替えても、切り替えた瞬間から奥まで犬・コインが埋まった状態で表示される
  // (逆に「表示・当たり判定・SE」の範囲は現在のviewHだけでクリップする、という役割分担)
  const WORLD_H = 900;
  const LANDSCAPE_VIEW_H = 600; // 横向き・PCで実際に見える縦の範囲(今までのBASE_H相当)
  const MIN_JOYSTICK_H = 100; // 縦持ちでジョイスティック用に必ず確保しておく最低の高さ(px)
  // カメラの前方追従(「プレイヤーが画面下から何pxの範囲なら自由に動けて、そこを超えたら前方へ
  // スクロールが始まるか」)は、向きの切り替え自体では変わらないよう固定値にする(viewHを直接
  // 使うと、向きを切り替えてviewHが変わっただけでプレイヤーが移動していないのにcamera.topが
  // 再計算され、画面上の見た目の位置がズレる=縦横切り替えのタイミングで自機がガクッと動いて
  // 見えるバグになるため)。横向きは今までの感覚(画面下から120px=8割地点)のまま、縦持ちは画面が
  // 縦に長い分、少しだけ余裕を持たせている(画面下から150px。「横のスクロール開始位置に近いが、
  // 少し高め・長めでもよい」という要望に合わせた)
  const SCROLL_TRIGGER_FROM_BOTTOM_LANDSCAPE = LANDSCAPE_VIEW_H * 0.2; // =120px
  const SCROLL_TRIGGER_FROM_BOTTOM_PORTRAIT = 150; // 横向きの120pxより少しだけ長め
  let viewH = LANDSCAPE_VIEW_H; // 現在実際に見えている(描画・音・当たり判定に使う)縦の範囲。applyLayout()が向きに応じて更新する

  // 現在の向きに応じた「先読み距離」(camera.top = player.worldY - この値、で前方追従する)を返す。
  // viewHが変わった瞬間はapplyLayout()側でcamera.topを別途補正しているので、この関数自体は
  // 単に「今の向きなら画面下から何pxが自由に動けるか」を返すだけでよい
  function cameraLookahead() {
    return viewH - (viewH === WORLD_H ? SCROLL_TRIGGER_FROM_BOTTOM_PORTRAIT : SCROLL_TRIGGER_FROM_BOTTOM_LANDSCAPE);
  }
  const camera = { top: 0 }; // 表示中の矩形の上端に対応するワールドY座標。applyLayout()内でviewHの変化分だけ調整する
  gameEl.style.width = BASE_W + 'px';

  // --- キャンバス(レーンの背景と犬を描画) ---
  const worldCanvas = document.getElementById('world');
  const wctx = worldCanvas.getContext('2d');
  const fxCanvas = document.getElementById('fx-layer');
  const fctx = fxCanvas.getContext('2d');

  function resizeCanvas(canvas, ctx) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = BASE_W * dpr;
    canvas.height = viewH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // --- スマホ(仮想ジョイスティック)入力 ---
  // nipplejsは生成時のzone要素の位置・サイズを基準にするため、縦横切り替えでzoneのサイズ・位置が
  // 変わった時にmanagerを使い回すと、繰り返し切り替えるうちにタッチ位置とジョイスティックの反応が
  // ズレていく不具合があった。applyLayout()がzoneのサイズを変更するたびに一度destroy()して
  // 作り直す(setupJoystick())ことで、常に最新のzoneの実サイズを基準にした状態にしている
  let manager = null;
  let joyVector = { x: 0, y: 0 };
  const joystickHintEl = document.getElementById('joystick-hint');

  function setupJoystick() {
    if (manager) manager.destroy();
    manager = nipplejs.create({
      zone: zone,
      mode: 'dynamic', // 触れた場所を中心にする
      color: 'white',
      size: 100,
    });
    manager.on('start', () => {
      // 操作中は常時表示用のヒント絵とnipplejs本体のジョイスティックが重なって見えるので、操作中だけヒントを隠す
      joystickHintEl.classList.add('hide');
    });
    manager.on('move', (evt, data) => {
      startBGM();
      if (data.vector) {
        // nipplejsのyは上が+なので、画面座標(下が+)に合わせて反転
        joyVector = { x: data.vector.x, y: -data.vector.y };
        tryResume(); // ヒット硬直中はジョイスティック操作でも復帰できるようにする
      }
    });
    manager.on('end', () => {
      joyVector = { x: 0, y: 0 };
      joystickHintEl.classList.remove('hide');
    });
  }
  setupJoystick();
  let lastPortraitMode = window.innerWidth < window.innerHeight; // setupJoystick()を再実行すべきタイミングの判定用

  // PC・横向き: 画面いっぱいに収まる最大サイズへcontain方式で縮小し、中央に配置する(従来通り)。
  //   ジョイスティックは画面左下の半分をタッチ領域として使う(ゲーム画面に重ねて半透明表示)
  // スマホ縦持ち: 論理解像度(800x600、横長)の縦横比は変えず、横幅いっぱいに合わせて画面上部に配置する。
  //   縦は余った分だけ使われる形になり、その下の残り領域をジョイスティック専用のスペースとして
  //   丸ごと確保する(ゲーム画面とは重ならない)。「縦持ちにしてください」という誘導は行わず、
  //   縦持ちのままでも問題なく遊べるようにする(2026-08-08 変更)
  function applyLayout() {
    const portrait = window.innerWidth < window.innerHeight;
    const newViewH = portrait ? WORLD_H : LANDSCAPE_VIEW_H; // 縦持ちは常に世界の全深さ(WORLD_H)をそのまま見せる
    if (newViewH !== viewH) {
      // 表示矩形の「下端」(camera.top + viewH)は据え置き、「上端」(camera.top、奥側)だけを
      // 変化分だけ伸縮させる。画面最下部にいるプレイヤーの見た目の位置がずれないようにするため
      camera.top += viewH - newViewH;
      viewH = newViewH;
    }
    gameEl.style.height = viewH + 'px';
    resizeCanvas(worldCanvas, wctx);
    resizeCanvas(fxCanvas, fctx);
    if (portrait) {
      // 横幅基準が基本だが、正方形に近いウィンドウ(例: 790x790)だと横幅基準のスケールのままだと
      // ゲーム画面の高さ(viewH*scale)が実際の画面の高さを超えてしまい、その下に置いているはずの
      // ジョイスティックが画面外に押し出されてしまう。高さ基準のスケール(ジョイスティック用に
      // MIN_JOYSTICK_H分を差し引いた残りに収める)も上限として掛け合わせ、どちらか小さい方を
      // 採用することで、ゲーム画面が画面をはみ出さず、かつジョイスティックの最低限の高さも確保する
      const heightBudget = Math.max(1, window.innerHeight - MIN_JOYSTICK_H); // 極端に低い画面でscaleが0以下にならないようにする
      const scale = Math.min(window.innerWidth / BASE_W, heightBudget / viewH);
      const gameH = viewH * scale;
      gameEl.style.left = '50%';
      gameEl.style.top = '0';
      gameEl.style.transformOrigin = 'top center'; // 縮小の基準を上端にし、上端がぴったり画面上部に張り付くようにする
      gameEl.style.transform = `translate(-50%, 0) scale(${scale})`;
      zone.style.left = '0';
      zone.style.top = gameH + 'px';
      zone.style.bottom = '';
      zone.style.width = '100%';
      zone.style.height = Math.max(0, window.innerHeight - gameH) + 'px';
    } else {
      const scale = Math.min(window.innerWidth / BASE_W, window.innerHeight / viewH);
      gameEl.style.left = '50%';
      gameEl.style.top = '50%';
      gameEl.style.transformOrigin = 'center center';
      gameEl.style.transform = `translate(-50%, -50%) scale(${scale})`;
      zone.style.left = '0';
      zone.style.top = '';
      zone.style.bottom = '0';
      zone.style.width = '50%';
      zone.style.height = '50%';
    }
    if (portrait !== lastPortraitMode) {
      // zoneのサイズ・位置が縦持ち/横向きで切り替わったので、nipplejsを作り直して最新のzoneを基準にさせる
      lastPortraitMode = portrait;
      setupJoystick();
    }
  }

  function handleResize() {
    applyLayout();
  }
  window.addEventListener('resize', handleResize);
  // iOS Safariは回転直後、window.innerWidth/innerHeightがアドレスバー等の
  // レイアウト確定前の古い値を一瞬返すことがあり、resizeイベント1回分の計算だけだと
  // 「縦→横に戻すとゲーム画面が縮んだまま」になることがある(実機フィードバックで発覚)。
  // orientationchange後、少し時間を置いて複数回再計算することで最終的な正しいサイズに追従させる
  window.addEventListener('orientationchange', () => {
    handleResize();
    setTimeout(handleResize, 100);
    setTimeout(handleResize, 300);
    setTimeout(handleResize, 600);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleResize);
  }
  handleResize();

  const speed = 200; // px/sec
  const JOYSTICK_SPEED_MULTIPLIER = 1.1; // 仮想ジョイスティック操作時は移動速度を+10%する

  // --- キーボード(WASD)入力 ---
  const keys = { w: false, a: false, s: false, d: false };

  window.addEventListener('keydown', (e) => {
    startBGM();
    const k = e.key.toLowerCase();
    if (!(k in keys)) return;
    keys[k] = true;
    dismissIntro();
    // ミス直後に押しっぱなしだったキーでは再開しない。離して押し直した時だけ再開を試みる
    if (!e.repeat && !staleKeysAtMiss.has(k)) tryResume();
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (!(k in keys)) return;
    keys[k] = false;
    staleKeysAtMiss.delete(k);
  });

  function keyboardVector() {
    let vx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    let vy = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
    const len = Math.hypot(vx, vy);
    if (len > 0) {
      vx /= len;
      vy /= len;
    }
    return { x: vx, y: vy };
  }

  // --- 効果音(SE): Howler.js(ゲーム音声向けライブラリ、CDNから読み込み)で再生する ---
  // 自前のWeb Audio API実装(AudioContext.resume()での手動アンロック)でも、iPhone実機で
  // 再生タイミングによっては`audioCtx.state`が`suspended`のまま(=無音)になることがあった。
  // Howlerは複数の入力イベント(touchstart/touchend/click/keydownなど)をdocument全体で
  // 監視し続け、成功するまで何度もアンロックを再試行する仕組みを標準で持っている
  // (`Howler.autoUnlock`、デフォルトtrue)ため、自前のアンロック処理より取りこぼしが少ない。
  // 同じ音の重ね鳴りもHowlの`play()`が内部で管理してくれるので、プール管理も不要になった
  const SE_DOG_SRCS = [
    'SE/dog01.mp3', 'SE/dog02.mp3', 'SE/dog03.mp3', 'SE/dog04.mp3',
    'SE/dog05.mp3', 'SE/dog06.mp3', 'SE/dog07.mp3', 'SE/dog08.mp3',
    // 犬が多い時の処理落ちの原因がSE再生自体(cloneNode+play())だったため、
    // updateDogs()側の呼び出しをコメントアウトして現在無効化している(2026-08-08)
  ];
  const SE_COIN_SRC = 'SE/coin.mp3';
  const COIN_SE_MIN_INTERVAL_MS = 100; // 同じSEを鳴らしてから最低これだけ間を空ける
  const DOG_SE_MIN_INTERVAL_MS = 220; // 犬の匹数が多い時に鳴き声が団子状に重なりすぎないよう間引く
  const DOG_SE_VOLUME = 0.15; // 犬の鳴き声の音量(0〜1)
  const COIN_SE_VOLUME = 0.9; // コイン獲得音の音量(0〜1)

  function createSEHowl(src, volume) {
    return new Howl({ src: [src], volume });
  }

  const seDogHowls = SE_DOG_SRCS.map((src) => createSEHowl(src, DOG_SE_VOLUME));
  const seCoinHowl = createSEHowl(SE_COIN_SRC, COIN_SE_VOLUME);

  let lastDogSEIndex = -1;
  let lastDogSEAt = -Infinity;
  function playDogSE() {
    const now = performance.now();
    if (now - lastDogSEAt < DOG_SE_MIN_INTERVAL_MS) return;
    lastDogSEAt = now;
    let idx = Math.floor(Math.random() * seDogHowls.length);
    if (seDogHowls.length > 1 && idx === lastDogSEIndex) {
      idx = (idx + 1 + Math.floor(Math.random() * (seDogHowls.length - 1))) % seDogHowls.length;
    }
    lastDogSEIndex = idx;
    seDogHowls[idx].play();
  }

  let lastCoinSEAt = -Infinity;
  function playCoinSE() {
    const now = performance.now();
    if (now - lastCoinSEAt < COIN_SE_MIN_INTERVAL_MS) return;
    lastCoinSEAt = now;
    seCoinHowl.play();
  }

  // --- BGM ---
  const BGM_SRC = 'SE/iwashiro_kokage_biyori.mp3';
  const BGM_VOLUME = 0.1; // BGMの音量(0〜1)

  const bgmAudio = new Audio(BGM_SRC);
  bgmAudio.loop = true;
  bgmAudio.preload = 'auto';
  bgmAudio.volume = BGM_VOLUME;

  let bgmStarted = false;
  function startBGM() {
    if (bgmStarted) return;
    // ブラウザの自動再生制限で最初は失敗しうるので、成功するまで各種ユーザー操作のたびに呼び直す
    bgmAudio.play().then(() => { bgmStarted = true; }).catch(() => {});
  }
  startBGM(); // 読み込み直後にも一応試す(自動再生が許可されている環境向け)

  // --- 犬(障害物)のスプライト読み込み ---
  // 見た目のパターンを複数用意している(今のところ動きの違いはなし、見た目だけランダムに選ぶ)
  const DOG_PATTERN_SRCS = [
    ['imgs/1-1.png', 'imgs/1-2.png', 'imgs/1-3.png', 'imgs/1-4.png'],
    ['imgs/2-1.png', 'imgs/2-2.png', 'imgs/2-3.png', 'imgs/2-4.png'],
    ['imgs/3-1.png', 'imgs/3-2.png', 'imgs/3-3.png', 'imgs/3-4.png'],
    ['imgs/4-1.png', 'imgs/4-2.png', 'imgs/4-3.png', 'imgs/4-4.png'],
  ];
  const DOG_KEY_COLOR = { r: 63, g: 200, b: 144 }; // 元画像の背景色
  const DOG_KEY_THRESHOLD = 60;
  const DOG_KEY_FEATHER = 40;
  const DOG_SCALE = 0.4; // 犬の大きさは常に一定

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  // 単色背景を透過させたキャンバスを作る(クロマキー)。犬は緑背景、コインは白背景なので色を差し替えられるようにしてある
  function chromaKeyToCanvas(img, keyColor = DOG_KEY_COLOR, threshold = DOG_KEY_THRESHOLD, feather = DOG_KEY_FEATHER) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const cctx = c.getContext('2d');
    cctx.drawImage(img, 0, 0);
    const imageData = cctx.getImageData(0, 0, c.width, c.height);
    const d = imageData.data;
    for (let i = 0; i < d.length; i += 4) {
      const dr = d[i] - keyColor.r;
      const dg = d[i + 1] - keyColor.g;
      const db = d[i + 2] - keyColor.b;
      const dist = Math.sqrt(dr * dr + dg * dg + db * db);
      if (dist < threshold) {
        d[i + 3] = 0;
      } else if (dist < threshold + feather) {
        d[i + 3] = Math.round(d[i + 3] * (dist - threshold) / feather);
      }
    }
    cctx.putImageData(imageData, 0, 0);
    return c;
  }

  let dogFrameSets = null; // 読み込み完了後、パターンごとに4コマ分のcanvas配列が入る([[c,c,c,c], [c,c,c,c]])
  let dogFrameW = 0, dogFrameH = 0;

  Promise.all(DOG_PATTERN_SRCS.map((srcs) => Promise.all(srcs.map(loadImage))))
    .then((patternImgs) => {
      dogFrameSets = patternImgs.map((imgs) => imgs.map((img) => chromaKeyToCanvas(img)));
      // サイズは常に一定にするため、素材ごとの解像度差によらずパターン1の寸法を基準にする
      dogFrameW = dogFrameSets[0][0].width * DOG_SCALE;
      dogFrameH = dogFrameSets[0][0].height * DOG_SCALE;
      drawContainedIcon(introDogIconEl, dogFrameSets[0][0], 34);
    })
    .catch((err) => console.error('犬の画像読み込みに失敗しました', err));

  // --- レーン(奥へ進むと生成される芝生の帯。見た目の縞模様とスコア単位のみに使用) ---
  const LANE_H = 140; // 1レーン = スコア表示の1m
  const GEN_BUFFER = 400;
  const REMOVE_BUFFER = 400;

  let lanes = [];
  let nextLaneIndex = 0;

  function createLane(index) {
    return {
      index,
      laneTop: -(index + 1) * LANE_H,
      laneBottom: -index * LANE_H,
      shade: index % 2 === 0,
    };
  }

  function ensureLanes(camTop) {
    if (lanes.length === 0) {
      while (nextLaneIndex * LANE_H < -camTop + WORLD_H + GEN_BUFFER) {
        lanes.push(createLane(nextLaneIndex));
        nextLaneIndex++;
      }
    }
    while (lanes[lanes.length - 1].laneTop > camTop - GEN_BUFFER) {
      lanes.push(createLane(nextLaneIndex));
      nextLaneIndex++;
    }
    const camBottom = camTop + viewH;
    while (lanes.length > 0 && lanes[0].laneTop > camBottom + REMOVE_BUFFER) {
      lanes.shift();
    }
  }

  function resetLanes() {
    lanes = [];
    nextLaneIndex = 0;
  }

  // --- 犬(障害物)の数は進んだ距離に応じてノコギリ波状に増減する ---
  // 0〜50mでMIN_DOGS→MAX_DOGSへ直線的に増加、50mを超えたところでMIN_DOGSまで一気に落ち着き、
  // また次の50m(51〜100m)で同じように増加…を繰り返す(DOG_CYCLE_LENGTH_M周期)。
  const MIN_DOGS = 3;
  const MAX_DOGS = 30;
  const DOG_CYCLE_LENGTH_M = 50;
  const SAFE_DISTANCE_PX = 300; // スタート直後は犬を出現させない距離

  let dogs = [];

  function targetDogCount(distanceM) {
    const posInCycle = distanceM % DOG_CYCLE_LENGTH_M;
    const t = posInCycle / DOG_CYCLE_LENGTH_M;
    return Math.round(MIN_DOGS + (MAX_DOGS - MIN_DOGS) * t);
  }

  // 犬1匹分の状態を(再)初期化する。カメラより先の未表示エリアに配置し直すことで使い回す
  function resetDog(dog, camTop, distanceM) {
    dog.dir = Math.random() < 0.5 ? 1 : -1;
    const speedBase = 100 + Math.min(140, distanceM * 0.8);
    dog.speed = speedBase + Math.random() * 120;
    dog.worldX = Math.random() * BASE_W;
    const forwardEdge = Math.min(camTop, -SAFE_DISTANCE_PX);
    dog.baseWorldY = forwardEdge - Math.random() * (WORLD_H + GEN_BUFFER);
    dog.frameIndex = Math.floor(Math.random() * 4);
    dog.frameTimer = Math.random() * 0.1;
    dog.frameInterval = 0.09 + Math.random() * 0.03;
    dog.bobPhase = Math.random() * Math.PI * 2;
    dog.bobFreq = 5 + Math.random() * 3;
    dog.bobAmp = 5 + Math.random() * 5;
    dog.yOffset = 0;
    dog.stopped = false;
    dog.fleeing = false; // 昼夕方の切り替えで逃走中・静止中だった場合も、再配置されたら通常状態に戻す
    dog.duskFrozen = false;
    dog.patternIndex = Math.floor(Math.random() * DOG_PATTERN_SRCS.length);
  }

  function isDogOnScreen(dog, camTop) {
    const screenY = dog.baseWorldY + dog.yOffset - camTop;
    return screenY > -dogFrameH && screenY < viewH + dogFrameH;
  }

  function ensureDogPopulation(distanceM, camTop) {
    const target = targetDogCount(distanceM);
    while (dogs.length < target) {
      const dog = {};
      resetDog(dog, camTop, distanceM);
      dogs.push(dog);
    }
    // 匹数が減る場合、プレイヤーがまだ見ていない(画面外の)犬は即座に間引いてよい。
    // 画面内で走っている犬だけは強制的に消さず、updateDogs() 側で自然に退場するのを待つ
    let excess = dogs.length - target;
    if (excess > 0) {
      dogs = dogs.filter((dog) => {
        if (excess > 0 && !isDogOnScreen(dog, camTop)) {
          excess--;
          return false;
        }
        return true;
      });
    }
  }

  function updateDogs(dt, distanceM) {
    const camBottom = camera.top + viewH;
    const half = dogFrameW / 2;
    const target = targetDogCount(distanceM);
    for (const dog of dogs) {
      if (dog.stopped) continue; // ミスの原因になった犬はその場で静止させる
      if (dog.duskFrozen) continue; // 「エサの時間」の呼びかけを理解している間は静止させる

      dog.worldX += dog.dir * dog.speed * dt;
      const wantsWrap = (dog.dir === 1 && dog.worldX > BASE_W + half) || (dog.dir === -1 && dog.worldX < -half);
      if (wantsWrap && (dogs.length > target || dog.fleeing)) {
        // 匹数が超過している間、または昼夕方の切り替えで逃走中の犬は、画面端まで達しても
        // 反対側から再出現させず、そのまま画面の外(=見えなくなった状態)で退場させる
        dog.gone = true;
        continue;
      }
      let wrapped = false;
      if (dog.dir === 1 && dog.worldX > BASE_W + half) { dog.worldX = -half; wrapped = true; }
      if (dog.dir === -1 && dog.worldX < -half) { dog.worldX = BASE_W + half; wrapped = true; }
      if (wrapped) {
        // 画面の端から犬が現れた瞬間。実際に見えている(画面内の縦位置にいる)時だけ鳴らす
        const screenY = dog.baseWorldY + dog.yOffset - camera.top;
        if (screenY > -dogFrameH && screenY < viewH + dogFrameH) playDogSE();
      }

      dog.bobPhase += dt * dog.bobFreq;
      dog.yOffset = Math.abs(Math.sin(dog.bobPhase) * dog.bobAmp);

      dog.frameTimer += dt;
      if (dog.frameTimer >= dog.frameInterval) {
        dog.frameTimer = 0;
        dog.frameIndex = (dog.frameIndex + 1) % 4;
      }

      // 画面のかなり後方まで流れたら、前方の未表示エリアに再配置して使い回す。
      // ただしその時点で匹数が目標を超えていれば、再配置はせずそのまま退場させる
      // (走っている最中の犬を強制的に消すのではなく、自然に画面外へ抜けたタイミングでだけ間引く)
      if (dog.baseWorldY > camBottom + REMOVE_BUFFER) {
        if (dogs.length > target) {
          dog.gone = true;
        } else {
          resetDog(dog, camera.top, distanceM);
        }
      }
    }
    if (dogs.some((d) => d.gone)) dogs = dogs.filter((d) => !d.gone);
  }

  function resetDogs() {
    dogs = [];
  }

  // --- コイン(収集アイテム) ---
  // imgs/coins.png は回転アニメ10コマが横に並んだスプライトシート(白背景)。
  // コマごとに絵の幅が違う(等間隔に並んでいない)ため、コマごとの開始x位置とその幅を配列で管理する。
  // ここでは仮の値(等間隔)を入れてあるだけなので、実際の画像に合わせて数値を調整すること。
  const COIN_FRAMES = [
    { x: 0, w: 52 },
    { x: 53, w: 54 },
    { x: 110, w: 49 },
    { x: 170, w: 37 },
    { x: 232, w: 26 },
    { x: 294, w: 11 },
    { x: 341, w: 27 },
    { x: 389, w: 40 },
    { x: 440, w: 48 },
    { x: 492, w: 52 },
  ];
  const COIN_FRAME_COUNT = COIN_FRAMES.length;
  const COIN_SRC = 'imgs/coins.png';
  const COIN_KEY_COLOR = { r: 255, g: 255, b: 255 };
  const COIN_KEY_THRESHOLD = 25;
  const COIN_KEY_FEATHER = 20;
  const COIN_SCALE = 0.5; // コインの大きさは常に一定
  const COIN_FRAME_INTERVAL = 0.05; // 回転アニメの1コマの秒数
  const COIN_COUNT = 12; // 画面(手前〜先読みエリア)に常に存在させる数
  const MAGNET_RADIUS = 72; // 自キャラ(直径36px)のおよそ2倍。この範囲に入ると吸い寄せられる
  const COLLECT_DIST = 16; // ここまで吸い寄せられたら獲得

  let coinSheet = null; // 読み込み完了後、透過済みのスプライトシート全体(1枚のcanvas)が入る
  let coinFrameH = 0; // 縦は全コマ共通の高さを想定

  loadImage(COIN_SRC)
    .then((img) => {
      coinFrameH = img.naturalHeight;
      coinSheet = chromaKeyToCanvas(img, COIN_KEY_COLOR, COIN_KEY_THRESHOLD, COIN_KEY_FEATHER);
      drawContainedIcon(introCoinIconEl, { canvas: coinSheet, sx: COIN_FRAMES[0].x, sw: COIN_FRAMES[0].w, sh: coinFrameH }, 34);
    })
    .catch((err) => console.error('コイン画像の読み込みに失敗しました', err));

  let coins = [];
  let currentCoins = 0;

  // --- 昼夕方の切り替え演出で使う「エサの吹き出し」画像(いずれも白背景なのでコインと同じ方式で透過する) ---
  // food1.png: 呼びかけ用の大きい横長の吹き出し(画面右からスライドインする)
  // food2.png: 各犬の頭上に出す小さい吹き出し(犬がごはんに気づいて走り去る合図)
  const FOOD_BIG_SRC = 'imgs/food1.png';
  const FOOD_SMALL_SRC = 'imgs/food2.png';
  let foodBigImg = null;
  let foodSmallImg = null;

  loadImage(FOOD_BIG_SRC)
    .then((img) => { foodBigImg = chromaKeyToCanvas(img, COIN_KEY_COLOR, COIN_KEY_THRESHOLD, COIN_KEY_FEATHER); })
    .catch((err) => console.error('food1画像の読み込みに失敗しました', err));
  loadImage(FOOD_SMALL_SRC)
    .then((img) => { foodSmallImg = chromaKeyToCanvas(img, COIN_KEY_COLOR, COIN_KEY_THRESHOLD, COIN_KEY_FEATHER); })
    .catch((err) => console.error('food2画像の読み込みに失敗しました', err));

  // コイン1枚分の状態を(再)初期化する。犬と同様、カメラより先の未表示エリアに配置し直して使い回す
  function resetCoin(coin, camTop) {
    coin.worldX = Math.random() * BASE_W;
    coin.worldY = Math.min(camTop, 0) - Math.random() * (WORLD_H + GEN_BUFFER);
    coin.frameIndex = Math.floor(Math.random() * COIN_FRAME_COUNT);
    coin.frameTimer = Math.random() * 0.1;
    coin.magnetized = false;
    coin.pickupDelay = 0;
  }

  function ensureCoinPopulation(camTop) {
    while (coins.length < COIN_COUNT) {
      const coin = {};
      resetCoin(coin, camTop);
      coins.push(coin);
    }
  }

  // 回転アニメだけは、ミス中(frozen)でも止めずに毎フレーム進める
  function updateCoinAnimation(dt) {
    for (const coin of coins) {
      coin.frameTimer += dt;
      if (coin.frameTimer >= COIN_FRAME_INTERVAL) {
        coin.frameTimer = 0;
        coin.frameIndex = (coin.frameIndex + 1) % COIN_FRAME_COUNT;
      }
      if (coin.scatter) updateCoinScatter(coin, dt); // 犬にぶつかってfrozen中でもばらまき演出は止めない
    }
  }

  function updateCoins(dt) {
    const camBottom = camera.top + viewH;
    for (const coin of coins) {
      if (coin.pickupDelay > 0) {
        coin.pickupDelay -= dt;
        continue; // ばらまかれた直後は磁石も効かず、拾えない
      }

      const dx = player.worldX - coin.worldX;
      const dy = player.worldY - coin.worldY;
      const dist = Math.hypot(dx, dy);

      if (!coin.magnetized && dist < MAGNET_RADIUS) coin.magnetized = true;

      if (coin.magnetized) {
        if (dist < COLLECT_DIST) {
          currentCoins++;
          playCoinSE();
          if (coin.bonus) {
            // 風船からのばらまきコインは使い回さず消える(通常のプール数には含めない)
            coin.gone = true;
          } else {
            resetCoin(coin, camera.top);
          }
          continue;
        }
        // 近づくほど加速する、磁石に吸い込まれるような動き
        const pullSpeed = 260 + (1 - Math.min(1, dist / MAGNET_RADIUS)) * 380;
        coin.worldX += (dx / dist) * pullSpeed * dt;
        coin.worldY += (dy / dist) * pullSpeed * dt;
      } else if (coin.worldY > camBottom + REMOVE_BUFFER) {
        if (coin.bonus) {
          // 拾われないまま画面後方へ流れたボーナスコインは、通常プールに紛れ込ませず消す
          coin.gone = true;
        } else {
          resetCoin(coin, camera.top);
        }
      }
    }
    if (coins.some((c) => c.gone)) coins = coins.filter((c) => !c.gone);
  }

  // ライフを失って再スタートする時に呼ぶ。配置だけリセットし、枚数(currentCoins)は維持する(コインは引き継ぐ)
  function resetCoinPositions() {
    coins = [];
  }

  // --- 風船(回復 or コインばらまき) ---
  // imgs/balloon-red.png は元から透過済みのPNGなのでクロマキー不要、そのままdrawImageできる
  const BALLOON_SRC = 'imgs/balloon-red.png';
  const BALLOON_SCALE = 0.15; // 表示の大きさ
  const BALLOON_R = 26; // 当たり判定の半径
  const BALLOON_SPAWN_DISTANCE_M = 5; // これだけ進むごとに1匹出現(同時に存在するのは1つまで)
  const BALLOON_APPROACH_SPEED = 40; // 自機が止まっていても少しずつ近づいてくる速度(px/s、ゆっくりめ)
  const BALLOON_SWAY_AMP = 55; // 蛇行の左右の振れ幅(px)
  const BALLOON_SWAY_SPEED = 1.6; // 蛇行の速さ(rad/s)
  const BALLOON_HEAL_RATIO = 0.25; // ライフが満タンでない時の回復量(最大HPに対する割合)
  const BALLOON_SCATTER_COINS = 50; // ライフが満タンの時にばらまくコインの枚数
  const BALLOON_SCATTER_RADIUS = 200; // ばらまく範囲(自キャラ中心、円形に散らばる半径のおおよその最大値、px)
  const BALLOON_SCATTER_PICKUP_DELAY = 1; // ばらまかれてから拾えるようになるまでの秒数
  // ばらまき演出(ハートと同じような放物線 + 小さく2回バウンド)のパラメータ
  const SCATTER_FLIGHT_TIME = 0.6; // 中心から目的地まで飛んでいく時間(秒)
  const SCATTER_HOP_SPEED = 400; // 最初のホップの高さを決める初速
  const SCATTER_GRAVITY = 1400;
  const SCATTER_BOUNCE_COUNT = 1; // 着地後に小さくバウンドする回数
  const SCATTER_BOUNCE_DAMPING = 0.5; // バウンドのたびに勢いが弱まる割合
  const SCATTER_STAGGER_SEC = 0.3; // 飛び始めをコインごとにこの範囲でランダムにずらす(0〜秒)

  let balloonImg = null;
  let balloon = null; // { baseX, worldY, swayPhase } / 存在しない時はnull
  let nextBalloonDistanceM = BALLOON_SPAWN_DISTANCE_M;

  loadImage(BALLOON_SRC)
    .then((img) => { balloonImg = img; })
    .catch((err) => console.error('風船画像の読み込みに失敗しました', err));

  function resetBalloon() {
    balloon = null;
    nextBalloonDistanceM = BALLOON_SPAWN_DISTANCE_M;
  }

  // 犬やコインと同じくワールド座標に置くので、自機が奥へ進む(camera.topが減る)とその分だけ
  // 画面上では相対的に下(自機側)へ流れてくる。止まっていても少しだけ近づいてくるよう定速度も足しておく
  function balloonWorldPos() {
    return {
      worldX: balloon.baseX + Math.sin(balloon.swayPhase) * BALLOON_SWAY_AMP,
      worldY: balloon.worldY,
    };
  }

  function ensureBalloon(distanceM) {
    if (balloon || !balloonImg) return;
    if (distanceM >= nextBalloonDistanceM) {
      balloon = {
        baseX: 80 + Math.random() * (BASE_W - 160),
        worldY: camera.top - 40, // 画面の少し上(まだ見えない少し先)から登場する
        swayPhase: Math.random() * Math.PI * 2,
      };
      nextBalloonDistanceM += BALLOON_SPAWN_DISTANCE_M;
    }
  }

  // 風船を回収した瞬間の処理。ライフが満タンでなければ回復、満タンならコインをばらまく
  function collectBalloon() {
    const { worldX: popupX, worldY: popupY } = balloonWorldPos();
    if (hp < MAX_HP) {
      hp = Math.min(MAX_HP, hp + MAX_HP * BALLOON_HEAL_RATIO);
      spawnPopup(popupX, popupY, 'LIFE UP!', '#7cff6b');
      return;
    }
    spawnPopup(popupX, popupY, 'BONUS!', '#ffd54f');
    const originX = player.worldX;
    const originY = player.worldY;
    for (let i = 0; i < BALLOON_SCATTER_COINS; i++) {
      // 均等に円周上へ散らしつつ、少しランダムにずらして自然な散らばりにする
      const angle = (i / BALLOON_SCATTER_COINS) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
      const radius = BALLOON_SCATTER_RADIUS * (0.6 + Math.random() * 0.4);
      const coin = {};
      resetCoin(coin, camera.top);
      coin.worldX = originX;
      coin.worldY = originY;
      coin.bonus = true; // 通常のプールに戻さず、回収したら消える一回限りのコイン
      coin.pickupDelay = BALLOON_SCATTER_PICKUP_DELAY; // ばらまかれた直後はしばらく拾えない
      coin.scatter = {
        originX,
        originY,
        targetX: originX + Math.cos(angle) * radius,
        targetY: originY + Math.sin(angle) * radius,
        t: 0,
        hopVz: SCATTER_HOP_SPEED,
        hopZ: 0,
        bounces: 0,
        delay: Math.random() * SCATTER_STAGGER_SEC, // 飛び始めを少しずつずらして一斉に動くのを防ぐ
      };
      coins.push(coin);
    }
  }

  // ハートの噴水と同じ考え方(重力で放物線を描く)を、中心から目的地まで飛んでいく2D散らばりに応用したもの。
  // 実際の当たり判定・磁石判定に使うworldX/worldYは目的地への直線移動、見た目の高さ(hopZ)だけ別に重力で弾ませて
  // 描画時にscreenYから引く(drawWorld側)。着地を数回繰り返すごとに勢いが弱まり、最後は完全に静止する
  function updateCoinScatter(coin, dt) {
    const s = coin.scatter;
    if (s.delay > 0) {
      // 個別にずらした遅延時間が過ぎるまでは自機の位置で足止めしておく(見た目は自機に重なって隠れる)
      s.delay -= dt;
      return;
    }
    s.t = Math.min(1, s.t + dt / SCATTER_FLIGHT_TIME);
    coin.worldX = s.originX + (s.targetX - s.originX) * s.t;
    coin.worldY = s.originY + (s.targetY - s.originY) * s.t;

    s.hopVz -= SCATTER_GRAVITY * dt;
    s.hopZ += s.hopVz * dt;
    if (s.hopZ <= 0) {
      s.hopZ = 0;
      s.bounces++;
      if (s.bounces > SCATTER_BOUNCE_COUNT) {
        coin.scatter = null; // 演出終了。以降は普通のコインとして扱う
      } else {
        s.hopVz = -s.hopVz * SCATTER_BOUNCE_DAMPING; // 着地の勢いを反転・減衰させて弾ませる
      }
    }
  }

  function updateBalloon(dt) {
    if (!balloon) return;
    balloon.worldY += BALLOON_APPROACH_SPEED * dt; // 自機が止まっていてもゆっくり近づく
    balloon.swayPhase += dt * BALLOON_SWAY_SPEED;

    const screenY = balloon.worldY - camera.top;
    if (screenY > viewH + 60) {
      balloon = null; // 誰にも回収されず画面下まで流れていったら消える
      return;
    }

    const { worldX, worldY } = balloonWorldPos();
    const dist = Math.hypot(player.worldX - worldX, player.worldY - worldY);
    if (dist < BALLOON_R + player.r) {
      collectBalloon();
      balloon = null;
    }
  }

  function drawBalloon() {
    if (!balloon || !balloonImg) return;
    const { worldX, worldY } = balloonWorldPos();
    const screenY = worldY - camera.top;
    const w = balloonImg.naturalWidth * BALLOON_SCALE;
    const h = balloonImg.naturalHeight * BALLOON_SCALE;

    // 紐の先端(画像下端)あたりを接地点とみなして地面に影を落とす
    drawShadow(wctx, worldX, screenY + h / 2, w);

    wctx.save();
    wctx.translate(worldX, screenY);
    wctx.rotate(Math.sin(balloon.swayPhase) * 0.15);
    wctx.drawImage(balloonImg, -w / 2, -h / 2, w, h);
    wctx.restore();
  }

  // 風船を取った場所に「LIFE UP!」/「BONUS!」を小さく表示する(スーパーマリオの1UPを少し大きくしたような演出)
  const POPUP_LIFE = 1.1; // 秒
  const POPUP_RISE_SPEED = 40; // px/s、ふわっと上に浮く速さ

  let popups = [];

  function spawnPopup(x, y, text, color) {
    popups.push({ x, y, text, color, timer: 0 });
  }

  function updatePopups(dt) {
    for (const p of popups) {
      p.timer += dt;
      p.y -= POPUP_RISE_SPEED * dt;
    }
    popups = popups.filter((p) => p.timer < POPUP_LIFE);
  }

  function drawPopup(ctx, p) {
    const t = p.timer / POPUP_LIFE;
    const alpha = t < 0.6 ? 1 : Math.max(0, 1 - (t - 0.6) / 0.4);
    const screenY = p.y - camera.top;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 44px sans-serif'; // 2026-08-08: 22pxから2倍に拡大(文字が小さいという指摘のため)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.strokeText(p.text, p.x, screenY);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, screenY);
    ctx.restore();
  }

  // --- ミス演出(ハートの噴水) ---
  let missFX = null; // { dog, groundY, contactX, heartTimer }
  let hearts = [];

  function spawnHeart(x, groundY) {
    hearts.push({
      x: x + (Math.random() - 0.5) * 24,
      y: groundY - 16,
      vx: (Math.random() - 0.5) * 105,
      vy: -(220 + Math.random() * 140),
      size: 9 + Math.random() * 7,
      alpha: 1,
      settled: false,
      settleTimer: 0,
      groundY,
    });
  }

  function updateMissFX(dt) {
    if (missFX) {
      missFX.heartTimer += dt;
      if (missFX.heartTimer > 0.055) {
        missFX.heartTimer = 0;
        spawnHeart(missFX.contactX, missFX.groundY);
      }
    }

    const GRAVITY = 700;
    for (const h of hearts) {
      if (h.settled) {
        h.settleTimer += dt;
        h.alpha = Math.max(0, 1 - h.settleTimer / 0.4);
        continue;
      }
      h.vy += GRAVITY * dt;
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      if (h.y >= h.groundY) {
        h.y = h.groundY;
        h.settled = true;
      }
    }
    hearts = hearts.filter((h) => h.alpha > 0.01);
  }

  function drawHeart(ctx, x, y, size, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ff6fa5';
    ctx.beginPath();
    const top = size * 0.3;
    ctx.moveTo(x, y + top);
    ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + top);
    ctx.bezierCurveTo(x - size / 2, y + (size + top) / 2, x, y + (size + top) / 2, x, y + size);
    ctx.bezierCurveTo(x, y + (size + top) / 2, x + size / 2, y + (size + top) / 2, x + size / 2, y + top);
    ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + top);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // --- プレイヤー & カメラ(前方へのみ進むスクロール) ---
  const player = { worldX: 0, worldY: 0, r: 18 };
  const PLAYER_HIT_R = player.r * 0.8; // 見た目より少し小さめの当たり判定にする
  let currentScore = 0;
  let bestScore = 0;
  let frozen = false; // ヒット硬直中・ゲームオーバー画面表示中はtrue(移動と当たり判定を止める)
  let duskAmount = 0; // 昼/夕方フィルターの現在の見た目の状態(0=昼〜1=夕方)
  let maxDuskDistanceM = 0; // 昼/夕方の切り替え判定専用の「これまでの最大到達距離」(戻っても後退しない)
  let lastDuskTarget = null; // 直前のcomputeDuskTarget()の結果。nullは「まだ未判定」(初回は演出を発生させない)
  let duskCallSeq = null; // 昼夕方切り替え時の「エサの時間だよー」演出の進行状態。null=演出なし、{phase:'sliding'|'frozen', timer}

  // --- ライフ・残機 ---
  const MAX_HP = 100;
  const HP_DAMAGE_PER_HIT = 25; // 犬にぶつかるたびに最大HPの25%減る
  const START_LIVES = 0;
  const HIT_RECOVER_MS = 3000; // ヒット後、何もしなくても自動で復帰するまでの時間
  const INVINCIBLE_MS = 2000; // 復帰後の無敵時間

  let hp = MAX_HP;
  let lives = START_LIVES;
  let invincibleUntil = 0; // performance.now()がこの値未満なら無敵
  let gameOver = false;
  let hitRecoverTimer = null;

  // ヒット直後・ゲームオーバー直後は一定時間・キー押しっぱなしでは再開(復帰/リスタート)しない
  const RESUME_GRACE_MS = 500;
  let missStartTime = 0;
  let staleKeysAtMiss = new Set();

  // タップ/WASD押し直し/ジョイスティック操作で呼ばれる。状況に応じて「ヒットから復帰」か「ゲームオーバーからリスタート」を行う
  function tryResume() {
    if (performance.now() - missStartTime < RESUME_GRACE_MS) return;
    if (gameOver) {
      resetGame();
      return;
    }
    recoverFromHit();
  }

  // 1ライフ分の状態をスタートに戻す(距離・カメラ・敵配置などをリセット。コインの枚数と残機・ベストは維持する)
  function resetLife() {
    player.worldX = BASE_W / 2;
    player.worldY = 0;
    camera.top = -cameraLookahead();
    resetLanes();
    resetDogs();
    resetCoinPositions();
    resetBalloon();
    missFX = null;
    hearts = [];
    popups = [];
    currentScore = 0;
    hp = MAX_HP;
    invincibleUntil = 0;
    frozen = false;
    maxDuskDistanceM = 0; // 新しいライフは昼(0m)から再スタート
    lastDuskTarget = null; // リスタート直後に昼/夕方の「切り替わった」判定が誤発火しないようにする
    duskCallSeq = null; // 進行中だった「エサの時間」演出も打ち切る
    playerEl.classList.remove('hit', 'licked', 'invincible');
    missEl.classList.remove('show');
  }

  // ゲーム全体を最初から始める(残機・コイン数もリセット)。初回起動時とゲームオーバーからのリスタート時に呼ぶ
  function resetGame() {
    lives = START_LIVES;
    currentCoins = 0;
    gameOver = false;
    gameOverEl.classList.remove('show');
    resetLife();
  }
  resetGame();

  // --- 初回起動時の「あそびかた」説明(2026-08-08 追加) ---
  let introActive = true; // trueの間はプレイヤー移動・当たり判定を止め、説明画面を表示し続ける
  const introShownAt = performance.now();
  const INTRO_INPUT_IGNORE_MS = 500; // 表示直後の意図しない入力(残っていたタップ/キー)で即終了しないよう無視する時間

  function dismissIntro() {
    if (!introActive) return;
    if (performance.now() - introShownAt < INTRO_INPUT_IGNORE_MS) return;
    introActive = false;
    introOverlayEl.classList.add('hide');
  }

  // 34x34の枠に収まるよう、アスペクト比を保ってcanvas全体に描画する(犬・コインアイコン共通)
  function drawContainedIcon(canvasEl, sourceCanvas, boxSize) {
    if (!canvasEl || !sourceCanvas) return;
    const dpr = window.devicePixelRatio || 1;
    canvasEl.width = boxSize * dpr;
    canvasEl.height = boxSize * dpr;
    canvasEl.style.width = boxSize + 'px';
    canvasEl.style.height = boxSize + 'px';
    const ictx = canvasEl.getContext('2d');
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sw = sourceCanvas.sw ?? sourceCanvas.width;
    const sh = sourceCanvas.sh ?? sourceCanvas.height;
    const scale = Math.min(boxSize / sw, boxSize / sh);
    const dw = sw * scale;
    const dh = sh * scale;
    if (sourceCanvas.sw) {
      ictx.drawImage(sourceCanvas.canvas, sourceCanvas.sx, 0, sw, sh, (boxSize - dw) / 2, (boxSize - dh) / 2, dw, dh);
    } else {
      ictx.drawImage(sourceCanvas, (boxSize - dw) / 2, (boxSize - dh) / 2, dw, dh);
    }
  }

  // 犬にぶつかった瞬間。即ミスにはせず、ライフを削って一定時間硬直させる
  function triggerMiss(dog) {
    if (frozen || gameOver) return;
    frozen = true;
    missStartTime = performance.now();
    staleKeysAtMiss = new Set(Object.keys(keys).filter((k) => keys[k]));
    hp = Math.max(0, hp - HP_DAMAGE_PER_HIT);
    bestScore = Math.max(bestScore, currentScore);
    dog.stopped = true;
    missFX = {
      dog,
      groundY: dog.baseWorldY + dog.yOffset,
      contactX: (player.worldX + dog.worldX) / 2,
      heartTimer: 0,
    };
    playerEl.classList.add('hit', 'licked');
    missEl.classList.add('show');
    missCoinScoreEl.textContent = currentCoins;

    clearTimeout(hitRecoverTimer);
    hitRecoverTimer = setTimeout(recoverFromHit, HIT_RECOVER_MS);
  }

  // ヒットの硬直から復帰する(3秒経過 or 入力、どちらか早い方)。HPが残っていればそのまま続行、0ならライフを失う
  function recoverFromHit() {
    if (!frozen || gameOver) return;
    clearTimeout(hitRecoverTimer);
    hitRecoverTimer = null;
    if (missFX) missFX.dog.stopped = false; // ぶつかった犬も復帰時に再び走り出させる
    missFX = null;
    playerEl.classList.remove('hit', 'licked');
    missEl.classList.remove('show');

    if (hp <= 0) {
      lives -= 1;
      if (lives <= 0) {
        triggerGameOver();
      } else {
        resetLife(); // 距離は0に戻る。コインは引き継ぐ
      }
    } else {
      frozen = false;
      invincibleUntil = performance.now() + INVINCIBLE_MS;
    }
  }

  function triggerGameOver() {
    gameOver = true; // frozenはtrueのまま維持し、移動・当たり判定を止め続ける
    missStartTime = performance.now();
    staleKeysAtMiss = new Set(Object.keys(keys).filter((k) => keys[k]));
    goDistanceEl.textContent = bestScore;
    goCoinsEl.textContent = currentCoins;
    gameOverEl.classList.add('show');
  }

  // ヒット硬直中・ゲームオーバー中、タップ(クリック)で復帰/リスタートする
  viewportEl.addEventListener('pointerdown', () => {
    startBGM();
    dismissIntro();
    tryResume();
  });

  function circleRectHit(cx, cy, r, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < r * r;
  }

  // 当たり判定は画像全体ではなく、縦は上から50%〜80%の範囲(体の中心〜脚のあたり)だけにする
  const HIT_TOP_RATIO = 0.6;
  const HIT_BOTTOM_RATIO = 0.7;

  // 画面最下部は安全地帯にする(自機がここにいる間は犬に当たらない)
  const BOTTOM_SAFE_ZONE_PX = 60;

  function checkCollision() {
    if (!dogFrameSets) return;
    if (introActive) return; // あそびかた説明中は当たらない
    if (performance.now() < invincibleUntil) return; // 無敵中は当たらない
    if (player.worldY > camera.top + viewH - BOTTOM_SAFE_ZONE_PX) return; // 画面最下部の安全地帯
    const hitW = dogFrameW * 0.55;
    const hitH = dogFrameH * (HIT_BOTTOM_RATIO - HIT_TOP_RATIO);
    for (const dog of dogs) {
      if (dog.fleeing || dog.duskFrozen) continue; // 「エサの時間」演出中(静止中・逃走中とも)は当たらない
      const dogY = dog.baseWorldY + dog.yOffset;
      const hitTop = dogY + dogFrameH * (HIT_TOP_RATIO - 0.5);
      const hitCenterY = hitTop + hitH / 2;
      if (Math.abs(hitCenterY - player.worldY) > hitH / 2 + PLAYER_HIT_R) continue;
      const rx = dog.worldX - hitW / 2;
      if (circleRectHit(player.worldX, player.worldY, PLAYER_HIT_R, rx, hitTop, hitW, hitH)) {
        triggerMiss(dog);
        return;
      }
    }
  }

  // 犬・コインの足元の地面につく影(横長の楕円)。犬やコインはジャンプ/バウンドで上下に動くが、影は地面の高さに固定する
  const SHADOW_Y_RATIO = 0.88; // 犬の画像の縦方向のどの位置を接地点とみなすか(50%が中心)

  function drawShadow(ctx, x, y, w) {
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.32, w * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawWorld() {
    const w = BASE_W;
    const h = viewH;
    wctx.fillStyle = '#7ec850';
    wctx.fillRect(0, 0, w, h);

    for (const lane of lanes) {
      const screenTop = lane.laneTop - camera.top;
      const screenBottom = lane.laneBottom - camera.top;
      if (screenBottom < 0 || screenTop > h) continue;
      wctx.fillStyle = lane.shade ? '#7ec850' : '#74bd47';
      wctx.fillRect(0, screenTop, w, screenBottom - screenTop);
    }

    if (coinSheet) {
      const coinDestH = coinFrameH * COIN_SCALE;
      // 奥(worldYが小さい)から手前の順に描く。ばらまき中は疑似的な高さ(hopZ)がある方を手前寄りとして扱う
      const sortedCoins = coins.slice().sort((a, b) => {
        const az = a.scatter ? a.scatter.hopZ : 0;
        const bz = b.scatter ? b.scatter.hopZ : 0;
        return (a.worldY + az) - (b.worldY + bz);
      });
      for (const coin of sortedCoins) {
        const hopZ = coin.scatter ? coin.scatter.hopZ : 0; // ばらまき演出中はバウンドの高さ分だけ浮かせて描く
        const groundScreenY = coin.worldY - camera.top;
        const screenY = groundScreenY - hopZ;
        if (screenY < -coinDestH || groundScreenY > h + coinDestH) continue;

        drawShadow(wctx, coin.worldX, groundScreenY + coinDestH * 0.35, coinDestH * 1.6);

        const f = COIN_FRAMES[coin.frameIndex];
        const destW = f.w * COIN_SCALE;
        wctx.drawImage(
          coinSheet,
          f.x, 0, f.w, coinFrameH,
          coin.worldX - destW / 2, screenY - coinDestH / 2, destW, coinDestH
        );
      }
    }

    if (dogFrameSets) {
      // 奥(baseWorldYが小さい)の犬から先に描き、手前側の犬が最後(前面)に重なるようにする
      const sortedDogs = dogs.slice().sort((a, b) => a.baseWorldY - b.baseWorldY);
      for (const dog of sortedDogs) {
        const screenY = dog.baseWorldY + dog.yOffset - camera.top;
        if (screenY < -dogFrameH || screenY > h + dogFrameH) continue;

        const shadowScreenY = dog.baseWorldY + dogFrameH * (SHADOW_Y_RATIO - 0.5) - camera.top;
        drawShadow(wctx, dog.worldX, shadowScreenY, dogFrameW);

        const frame = dogFrameSets[dog.patternIndex][dog.frameIndex];
        wctx.save();
        wctx.translate(dog.worldX, screenY);
        if (dog.dir === 1) wctx.scale(-1, 1);
        wctx.drawImage(frame, -dogFrameW / 2, -dogFrameH / 2, dogFrameW, dogFrameH);
        wctx.restore();

        // 逃走中は頭上に小さい「エサに気づいた」吹き出しを出す
        if (dog.fleeing && foodSmallImg) {
          const fw = foodSmallImg.width * FOOD_SMALL_SCALE;
          const fh = foodSmallImg.height * FOOD_SMALL_SCALE;
          wctx.drawImage(foodSmallImg, dog.worldX - fw / 2, screenY - dogFrameH / 2 - fh - 4, fw, fh);
        }
      }
    }

    drawBalloon();
  }

  // 「エサの時間だよー」の大きい吹き出し。画面右から吹き出し全体がスライドインし、
  // 静止フェーズの間はその位置に留まる(#fx-layerに描画するので画面に固定され、カメラの影響を受けない)
  const FOOD_BIG_SCALE = 1.2; // 2026-08-08: 0.75から拡大(「大きな吹き出しが小さい」という指摘のため)
  const FOOD_SMALL_SCALE = 0.4;
  function drawDuskCallBubble(ctx) {
    if (!duskCallSeq || !foodBigImg) return;
    const w = foodBigImg.width * FOOD_BIG_SCALE;
    const h = foodBigImg.height * FOOD_BIG_SCALE;
    const restX = BASE_W - w - 20;
    let x;
    if (duskCallSeq.phase === 'sliding') {
      const t = Math.min(1, duskCallSeq.timer / DUSK_CALL_SLIDE_SEC);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out。「ニョキッと」入ってくる勢いを付ける
      x = BASE_W - eased * (BASE_W - restX);
    } else {
      x = restX; // 静止フェーズはそのまま表示し続ける
    }
    ctx.drawImage(foodBigImg, x, 175, w, h); // yは右上のHUD(距離/ベスト/コイン)と被らない位置に調整
  }

  function drawFx() {
    fctx.clearRect(0, 0, BASE_W, viewH);
    for (const h of hearts) drawHeart(fctx, h.x, h.y - camera.top, h.size, h.alpha);
    for (const p of popups) drawPopup(fctx, p);
    drawDuskCallBubble(fctx);
  }

  // --- 昼/夕方の色フィルター(50mごとに交互。距離に応じてではなく、境界を跨いだ瞬間に
  //     一定時間かけてフェードする) ---
  const DAYNIGHT_CYCLE_M = 50; // これだけ進むごとに昼⇔夕方が切り替わる
  const DAYNIGHT_FADE_SEC = 2; // 境界を跨いだ瞬間からこの秒数かけてフェードする
  const DUSK_MAX_OPACITY = 0.2; // 夕方フィルターの最大の濃さ(少しだけ、を意識した控えめな値)

  // 0(昼)か1(夕方)かの「目標」を返す。DAYNIGHT_CYCLE_Mごとに交互になる(0〜50=昼、50〜100=夕方…)
  function computeDuskTarget(distanceM) {
    const superCycle = DAYNIGHT_CYCLE_M * 2;
    const pos = ((distanceM % superCycle) + superCycle) % superCycle; // 0〜100
    return pos < DAYNIGHT_CYCLE_M ? 0 : 1;
  }

  // duskAmountを目標値へDAYNIGHT_FADE_SEC秒かけて直線的に近づける。
  // 判定にはdistanceMをそのまま使わず「これまでの最大到達距離」(maxDuskDistanceM)を使う。
  // プレイヤーは画面内なら後退もできるため、境界付近を行き来すると生の距離では
  // 昼/夕方の目標が跨ぐたびに反転してしまい、フェードが始まっては巻き戻る「ちらつき」になっていた
  function updateDuskAmount(dt, distanceM) {
    // HUDの「距離: Xm」はMath.round()した値を表示している。ここも同じ丸め方にしておかないと、
    // 例えば連続値が49.5の時点でHUDは既に「50」と表示するのに、切り替え判定は50.0にならないと
    // 発動しない、というズレが生まれる(「50mで止まっていても発動しない」の原因だった)
    maxDuskDistanceM = Math.max(maxDuskDistanceM, Math.round(distanceM));
    const target = computeDuskTarget(maxDuskDistanceM);
    if (lastDuskTarget !== null && target !== lastDuskTarget) triggerDuskCall();
    lastDuskTarget = target;
    const step = dt / DAYNIGHT_FADE_SEC;
    if (duskAmount < target) duskAmount = Math.min(target, duskAmount + step);
    else if (duskAmount > target) duskAmount = Math.max(target, duskAmount - step);
  }

  // 昼⇔夕方が切り替わった瞬間の「エサの時間だよー」演出。3段階で進行する。
  // ①(0〜DUSK_CALL_SLIDE_SEC秒)画面右から大きい吹き出しがスライドインする。犬は普段通り動き、当たり判定もある
  // ②(スライドイン完了後、DUSK_FREEZE_SEC秒)その時点にいた犬全員が「話を理解する」ため静止する。
  //   このタイミングから当たり判定を切る(高速で動かす前に無敵にしておく)
  // ③(静止が終わった瞬間)大きい吹き出しを消し、各犬の頭上に小さい吹き出しを出しつつ
  //   DOG_FLEE_SPEED_MULTIPLIER倍速で画面の近い方の端へ走り去らせる(当たり判定は引き続き無し)
  const DUSK_CALL_SLIDE_SEC = 0.2; // 大きい吹き出しがスライドインする時間
  const DUSK_FREEZE_SEC = 0.8; // スライドイン完了後、犬が静止している時間
  const DOG_FLEE_SPEED_MULTIPLIER = 1.5; // 2026-08-08: 3から引き下げ(「走る速さが早すぎた」という指摘のため)

  function triggerDuskCall() {
    duskCallSeq = { phase: 'sliding', timer: 0 };
  }

  function updateDuskCallSequence(dt) {
    if (!duskCallSeq) return;
    duskCallSeq.timer += dt;
    if (duskCallSeq.phase === 'sliding' && duskCallSeq.timer >= DUSK_CALL_SLIDE_SEC) {
      duskCallSeq.phase = 'frozen';
      duskCallSeq.timer = 0;
      for (const dog of dogs) dog.duskFrozen = true; // その時点にいた犬だけが対象
    } else if (duskCallSeq.phase === 'frozen' && duskCallSeq.timer >= DUSK_FREEZE_SEC) {
      for (const dog of dogs) {
        if (!dog.duskFrozen) continue; // 静止フェーズの間に新しく湧いた犬は対象外
        dog.duskFrozen = false;
        dog.fleeing = true;
        dog.dir = dog.worldX < BASE_W / 2 ? -1 : 1; // 画面の近い方の端へ
        dog.speed *= DOG_FLEE_SPEED_MULTIPLIER;
      }
      duskCallSeq = null; // 演出終了。以降は既存のfleeing処理(端で退場)に任せる
    }
  }

  // --- タブが非アクティブになったらBGMを止め、ゲーム全体も一時停止する ---
  let gamePaused = false;

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      gamePaused = true;
      bgmAudio.pause();
    } else {
      gamePaused = false;
      last = performance.now(); // dtが跳ね上がらないよう基準を今にリセット
      if (bgmStarted) bgmAudio.play().catch(() => {});
    }
  });

  // --- ゲームループ ---
  let last = performance.now();
  let wasPaused = false;
  function loop(now) {
    if (gamePaused) {
      wasPaused = true;
      requestAnimationFrame(loop);
      return;
    }
    if (wasPaused) {
      last = now; // 一時停止中に止まっていた分、dtが跳ね上がらないよう基準をリセット
      wasPaused = false;
    }

    let dt = (now - last) / 1000;
    if (dt > 0.05) dt = 0.05; // タブ切り替え等での大ジャンプを防ぐ
    last = now;

    ensureLanes(camera.top);

    const distanceM = Math.max(0, -player.worldY / LANE_H);
    updateDuskAmount(dt, distanceM);
    updateDuskCallSequence(dt);
    daynightOverlayEl.style.opacity = duskAmount * DUSK_MAX_OPACITY;
    ensureDogPopulation(distanceM, camera.top);
    updateDogs(dt, distanceM);
    // デバッグ用の画面内犬数表示は不要になったのでコメントアウト(2026-08-08)
    // dogDebugActualEl.textContent = dogs.filter((d) => isDogOnScreen(d, camera.top)).length;
    // dogDebugTargetEl.textContent = targetDogCount(distanceM);
    updateMissFX(dt);
    updatePopups(dt);
    ensureCoinPopulation(camera.top);
    updateCoinAnimation(dt);

    if (!frozen && !introActive) {
      const kv = keyboardVector();
      // キーボード入力があればそちらを優先、なければジョイスティックの入力を使う
      const usingKeyboard = kv.x !== 0 || kv.y !== 0;
      const v = usingKeyboard ? kv : joyVector;
      const effectiveSpeed = usingKeyboard ? speed : speed * JOYSTICK_SPEED_MULTIPLIER;

      let nx = player.worldX + v.x * effectiveSpeed * dt;
      let ny = player.worldY + v.y * effectiveSpeed * dt;

      nx = Math.max(player.r, Math.min(BASE_W - player.r, nx));
      ny = Math.max(camera.top + player.r, Math.min(camera.top + viewH - player.r, ny));

      player.worldX = nx;
      player.worldY = ny;

      camera.top = Math.min(camera.top, player.worldY - cameraLookahead());

      updateCoins(dt);
      checkCollision();
      ensureBalloon(distanceM);
      updateBalloon(dt);
    }

    currentScore = Math.max(0, Math.round(-player.worldY / LANE_H));
    scoreEl.textContent = currentScore;
    bestEl.textContent = Math.max(bestScore, currentScore);
    coinScoreEl.textContent = currentCoins;

    lifeBarFillEl.style.width = (hp / MAX_HP * 100) + '%';
    lifeBarFillEl.style.background = hp > MAX_HP * 0.5 ? '#4caf50' : (hp > MAX_HP * 0.25 ? '#ffca28' : '#ff5252');
    // livesCountEl.textContent = lives;

    playerEl.classList.toggle('invincible', performance.now() < invincibleUntil);

    playerEl.style.left = player.worldX + 'px';
    playerEl.style.top = (player.worldY - camera.top) + 'px';

    drawWorld();
    drawFx();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
